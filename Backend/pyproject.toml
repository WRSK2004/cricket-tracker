[project]
name = "cricket-tracker-backend"
version = "0.2.0"
description = "API for Cricket Tracker: technique analysis and health metrics"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "firebase-admin>=6.5",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "mediapipe==0.10.32",
    "numpy>=2.0,<2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with calls in defaults; this is the intended usage
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
