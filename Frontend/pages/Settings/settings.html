<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/shared.css">
    <link rel="stylesheet" href="settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Settings</title>
</head>
<body>
    <header class="app-header">
        <img src="../../assets/logo.png" alt="Logo" class="logo">
        <h1>Cricket Tracker</h1>
        <button class="login-button" id="loginButton">Account</button>
    </header>
    <main class="app-layout">
        <nav class="top-nav">
            <ul class="navigation">
                <li><a href="../Homepage/homepage.html">Home</a></li>
                <li><a href="../Practice_Sessions/practiceSessions.html">Practice Sessions</a></li>
                <li><a href="../Health_and_Fitness/healthTracker.html">Health & Fitness</a></li>
                <li><a href="../Help/help.html">Help</a></li>
                <li><a href="settings.html" class="active">Settings</a></li>
            </ul>
        </nav>

        <section class="dashboard">
            <div class="dashboard-grid">
                <div class="panel">
                    <div class="account-settings">
                        <h2 class="panel-title">Account Settings</h2>

                        <label for="new-display-name">New Display Name:</label>
                        <input type="text" id="new-display-name" placeholder="Enter new display name" class="settings-input">
                        <button id="update-display-name-button" class="save-button">Update Display Name</button>
                        <p id="display-name-status"></p>

                        <hr class="settings-divider">

                        <label for="current-password-2">Current Password:</label>
                        <input type="password" id="current-password-2" placeholder="Enter current password" class="settings-input">

                        <label for="new-password">New Password:</label>
                        <input type="password" id="new-password" placeholder="Enter new password" class="settings-input">
                        <button id="update-password-button" class="save-button">Update Password</button>
                        <p id="password-status"></p>
                    </div>
                </div>
                
                <div class="panel">
                    <div class="profile">
                        <h2 class="panel-title">Profile Settings</h2>
                        
                        <label for="batting-hand">Select your Batting Hand:</label> 
                        <select id="batting-hand"> 
                            <option value="none">None</option> 
                            <option value="left">Left</option> 
                            <option value="right">Right</option> 
                        </select>

                        <label for="bowling-hand">Select your Bowling Hand:</label> 
                        <select id="bowling-hand"> 
                            <option value="none">None</option> 
                            <option value="left">Left</option> 
                            <option value="right">Right</option> 
                        </select> 
                            
                        <label for="bowling-style">Select your Bowling Style:</label> 
                        <select id="bowling-style"> 
                            <option value="none">None</option> 
                            <option value="fast">Fast</option> 
                            <option value="medium">Medium</option> 
                            <option value="off-spin">Off Spin</option> 
                            <option value="leg-spin">Leg Spin</option>
                        </select> 

                        <label for="role">Select your Role:</label> 
                        <select id="role"> 
                            <option value="none">None</option> 
                            <option value="batsman">Batsman</option> 
                            <option value="bowler">Bowler</option> 
                            <option value="allrounder">All-rounder</option> 
                            <option value="wicketkeeper">Wicketkeeper</option>
                        </select>

                        <button id="save-profile-button" class="save-button">Save Profile Settings</button>
                        <p id="save-status"></p>
                    </div>
                </div>

                <div class="panel">
                    <div class="preferences"> 
                        <h2 class="panel-title">App Preferences</h2> 
                        
                        <label for="theme">Select App Theme:</label> 
                        <select id="theme"> 
                            <option value="light">Light</option> 
                            <option value="dark">Dark</option>  
                        </select> 
                        
                        <label for="notifications">Notification Settings:</label> 
                        <select id="notifications"> 
                            <option value="all">All Notifications</option> 
                            <option value="important">Only Important Notifications</option> 
                            <option value="none">No Notifications</option> 
                        </select>
                    </div>
                </div>

                <div class="panel">
                    <div class="data-privacy"> 
                        <h2 class="panel-title">Data & Privacy</h2> 
                        
                        <button class="data-button">Download My Data</button> 
                        <button class="data-button">Delete My Account</button> 
                    </div> 
                </div>

            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Cricket Tracker. All rights reserved.</p>
    </footer>
    
    
    <script type="module" src="settings.js"></script>
    <script type="module" src="../../utils/authentication_guard.js"></script>
</body>
</html>
